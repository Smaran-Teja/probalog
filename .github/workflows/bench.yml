on:
  workflow_dispatch:
  push:
  pull_request:

name: benchmark

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Racket is pinned to a fixed release rather than "current" so that a
      # change in the numbers can be attributed to a probalog commit rather
      # than to Racket moving underneath us. Fetching the rsdd shared
      # library is the slow part, so the package addon dir is cached.
      #
      # Both directories live outside the workspace on purpose. The package
      # being installed is the repository root, and `raco pkg install`
      # refuses to link a directory that encloses a collection path --
      # which either of these would, if nested inside it.
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: "x64"
          distribution: "full"
          version: "9.1"
          dest: "${{ runner.temp }}/racket"
          sudo: never

      - name: Point package installs at the addon dir
        run: echo "PLTADDONDIR=${{ runner.temp }}/racket-addon" >> "$GITHUB_ENV"

      - name: Cache Racket packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/racket-addon
          key: racket-pkgs-${{ runner.os }}-${{ hashFiles('info.rkt') }}-${{ github.sha }}
          restore-keys: |
            racket-pkgs-${{ runner.os }}-${{ hashFiles('info.rkt') }}-
            racket-pkgs-${{ runner.os }}-

      # Pulls the `roulette-*` platform package carrying librsdd; none of
      # roulette's Racket code is involved.
      #
      # On a cache hit the package is already linked and `raco pkg install`
      # refuses, so update first and fall back to install on a cold cache.
      # `raco setup` is then explicit: updating a link whose dependencies
      # are unchanged does no work at all, and the checkout it points at is
      # fresh, so without this nothing would be compiled until the
      # benchmarks ran -- putting compilation inside the timings.
      #
      # An absolute path is required for the install: `raco pkg install .`
      # is rejected, because the last path element has to be the name.
      - name: Install probalog and its dependencies
        run: |
          raco pkg update --auto --no-docs probalog \
            || raco pkg install --auto --no-docs "$GITHUB_WORKSPACE"
          raco setup --no-docs --pkgs probalog

      - name: Run tests
        run: raco test test/probalog.rkt

      - name: Run benchmarks
        run: |
          cd examples/bench
          timeout --kill-after=10s 10m racket run-benchmarks.rkt \
            -o "${{ github.workspace }}/results.json" \
            "${{ github.sha }}" "${{ github.event.head_commit.message }}"

      - name: Summarise
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d = json.load(open(os.environ["GITHUB_WORKSPACE"] + "/results.json"))
          print("### probalog benchmarks\n")
          print("commit `%s`\n" % d["commit"][:12])
          print("| benchmark | wall (ms) | find-bindings | guard build | set-union | index |")
          print("| --- | ---: | ---: | ---: | ---: | ---: |")
          for b in d["benchmarks"]:
              print("| %s | %.1f | %.1f | %.1f | %.1f | %.1f |" % (
                  b["name"], b["wall_ms"], b["find_bindings_ms"],
                  b["guard_build_ms"], b["set_union_ms"], b["index_ms"]))
          t = d["total"]
          print("| **total** | **%.1f** | %.1f | %.1f | %.1f | %.1f |" % (
              t["wall_ms"], t["find_bindings_ms"], t["guard_build_ms"],
              t["set_union_ms"], t["index_ms"]))
          PY

      # Always keep the run's own numbers, so the workflow is useful even
      # before the history repository below is set up.
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: results.json

      # Appending to a separate repository is what makes trends visible
      # across commits. Skipped unless a PAT is configured, and only from
      # the default branch, so forks and pull requests do not write to it.
      - name: Append to benchmark history
        if: >-
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "no PAT secret configured; skipping history push"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:$PAT@github.com/Smaran-Teja/probalog-bench-data.git" history
          mkdir -p history/results
          cp results.json "history/results/${{ github.sha }}.json"
          cd history
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "benchmark results for ${{ github.sha }}"
          git push

  # Cross-engine comparisons. These check that probalog agrees with other
  # engines as well as how fast it is, so they are informative rather than
  # gating: the job is `continue-on-error`, and a matrix entry whose tool
  # fails to install does not hold up the rest.
  #
  # One entry per tool so they run in parallel; wall-clock is the slowest,
  # not the sum. Every run uses `--quick` and a per-run timeout. souffle,
  # problog and cplint install in seconds; psouffle and scallop are built
  # from source and are cached, so only a cold cache pays for them.
  comparisons:
    name: compare vs ${{ matrix.tool }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: [problog, souffle, cplint, psouffle, scallop]
    steps:
      - uses: actions/checkout@v5

      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: "x64"
          distribution: "full"
          version: "9.1"
          dest: "${{ runner.temp }}/racket"
          sudo: never

      - name: Point package installs at the addon dir
        run: echo "PLTADDONDIR=${{ runner.temp }}/racket-addon" >> "$GITHUB_ENV"

      - name: Cache Racket packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/racket-addon
          key: racket-pkgs-${{ runner.os }}-${{ hashFiles('info.rkt') }}-${{ github.sha }}
          restore-keys: |
            racket-pkgs-${{ runner.os }}-${{ hashFiles('info.rkt') }}-
            racket-pkgs-${{ runner.os }}-

      - name: Install probalog
        run: |
          raco pkg update --auto --no-docs probalog \
            || raco pkg install --auto --no-docs "$GITHUB_WORKSPACE"
          raco setup --no-docs --pkgs probalog

      # --- per-tool setup -------------------------------------------------

      # The venv embeds absolute paths, so it is only reusable because the
      # workspace path is fixed on hosted runners.
      - name: Cache ProbLog virtualenv
        if: matrix.tool == 'problog'
        uses: actions/cache@v6
        with:
          path: examples/bench/.venv
          key: problog-venv-${{ runner.os }}-${{ hashFiles('examples/bench/compare-problog.sh') }}

      # Souffle is not in Ubuntu's repositories, so take the .deb from the
      # latest upstream release. The asset is named for the Ubuntu version
      # it was built against, so pick the one matching this runner and fall
      # back to the newest available if that image is too new to have one.
      - name: Install Souffle
        if: matrix.tool == 'souffle'
        run: |
          set -o pipefail
          rel=$(curl -fsSL https://api.github.com/repos/souffle-lang/souffle/releases/latest)
          want=$(lsb_release -rs | tr -d .)
          url=$(printf '%s' "$rel" | jq -r --arg v "$want" \
                '.assets[] | select(.name | test("ubuntu-" + $v + ".*\\.deb$")) | .browser_download_url')
          if [ -z "$url" ]; then
            echo "no .deb built for Ubuntu $want; using the newest available"
            url=$(printf '%s' "$rel" | jq -r \
                  '[.assets[] | select(.name | test("ubuntu.*\\.deb$")) | .browser_download_url] | sort | last')
          fi
          echo "installing $url"
          curl -fsSL -o /tmp/souffle.deb "$url"
          sudo apt-get update
          sudo apt-get install -y /tmp/souffle.deb
          souffle --version | head -1

      - name: Install SWI-Prolog
        if: matrix.tool == 'cplint'
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog
          swipl --version

      # cplint is a pack, compiled on first install into the user's pack dir.
      - name: Cache cplint pack
        if: matrix.tool == 'cplint'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/swi-prolog/pack
          key: cplint-pack-${{ runner.os }}-v1

      - name: Install PSouffle build prerequisites
        if: matrix.tool == 'psouffle'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake bison flex libffi-dev zlib1g-dev \
                                  libncurses-dev mcpp

      # The script builds CUDD and the Souffle fork here and reuses them.
      - name: Cache PSouffle build
        if: matrix.tool == 'psouffle'
        uses: actions/cache@v6
        with:
          path: ~/.cache/probalog-psouffle
          key: psouffle-${{ runner.os }}-${{ hashFiles('examples/bench/compare-psouffle.sh') }}

      - name: Cache Scallop build
        if: matrix.tool == 'scallop'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ${{ runner.temp }}/scallop
          key: scallop-${{ runner.os }}-v1

      - name: Build Scallop's scli
        if: matrix.tool == 'scallop'
        run: |
          src="${{ runner.temp }}/scallop"
          if [ ! -x "$src/target/release/scli" ]; then
            git clone --depth 1 https://github.com/scallop-lang/scallop "$src"
            rustup toolchain install nightly --profile minimal
            cargo +nightly build --release \
              --manifest-path "$src/etc/scli/Cargo.toml"
          fi
          echo "SCLI=$src/target/release/scli" >> "$GITHUB_ENV"

      # --- run ------------------------------------------------------------

      # pipefail so a failing comparison is not masked by `tee` succeeding.
      # The job is continue-on-error, so this reports rather than gates.
      - name: Run comparison
        run: |
          set -o pipefail
          cd examples/bench
          ./compare-${{ matrix.tool }}.sh --quick --timeout 30 \
            2>&1 | tee "$RUNNER_TEMP/compare.txt"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### probalog vs ${{ matrix.tool }}"
            echo
            echo '```'
            tail -60 "$RUNNER_TEMP/compare.txt" 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
